<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Let's Learning English — a picture-word quiz for children aged 3-6." />
  <title>Let's Learning English</title>
  <style>
    :root {
      --ink: #34304f;
      --coral: #ff7a59;
      --sun: #ffd166;
      --sky: #66c7ff;
      --mint: #69d6a3;
      --paper: #ffffff;
      --wrong: #ef4444;
      --wrong-dark: #b91c1c;
      --right: #22c55e;
      --right-dark: #15803d;
      --soft: #6b6690;
    }

    * { box-sizing: border-box; }

    html, body { margin: 0; min-height: 100%; }

    body {
      font-family: "Comic Sans MS", "Chalkboard SE", "Marker Felt", "Segoe UI", system-ui, sans-serif;
      color: var(--ink);
      background:
        radial-gradient(circle at 12% 15%, #ffe3c4 0 16%, transparent 17%),
        radial-gradient(circle at 88% 84%, #d9f2ff 0 18%, transparent 19%),
        linear-gradient(160deg, #fff8ea 0%, #ffeef3 100%);
      background-attachment: fixed;
      min-height: 100svh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 18px;
    }

    .app { width: min(700px, 100%); }

    .screen {
      display: none;
      flex-direction: column;
      align-items: center;
      text-align: center;
    }
    .screen.is-active {
      display: flex;
      animation: pop 0.35s ease both;
    }
    [hidden] { display: none !important; }

    @keyframes pop {
      from { opacity: 0; transform: scale(0.96) translateY(8px); }
      to   { opacity: 1; transform: none; }
    }
    @keyframes bounce {
      0%, 100% { transform: translateY(0); }
      45%      { transform: translateY(-12px); }
    }
    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      20%      { transform: translateX(-7px); }
      40%      { transform: translateX(7px); }
      60%      { transform: translateX(-5px); }
      80%      { transform: translateX(5px); }
    }
    @keyframes fall {
      from { transform: translateY(-80px) rotate(0deg); }
      to   { transform: translateY(105vh) rotate(360deg); }
    }

    /* ---------- Home screen ---------- */
    .home__letters {
      display: flex;
      gap: 14px;
      margin-bottom: 6px;
      font-size: clamp(2rem, 6vw, 2.8rem);
      font-weight: 800;
    }
    .home__letters span {
      width: 1.6em;
      height: 1.6em;
      display: grid;
      place-items: center;
      border: 4px solid var(--ink);
      border-radius: 24px;
      box-shadow: 0 6px 0 var(--ink);
    }
    .home__letters span:nth-child(1) { background: #ffd9c7; transform: rotate(-6deg); }
    .home__letters span:nth-child(2) { background: #ffeeb8; transform: rotate(4deg); }
    .home__letters span:nth-child(3) { background: #cdf1ff; transform: rotate(-3deg); }

    .home__title {
      font-size: clamp(2rem, 7.4vw, 3.6rem);
      line-height: 1.12;
      margin: 14px 0 10px;
      color: var(--coral);
      text-shadow: 0 3px 0 #fff, 0 8px 0 rgba(255, 138, 92, 0.25);
    }
    .home__sub {
      margin: 0;
      font-size: clamp(1rem, 2.9vw, 1.25rem);
      color: var(--soft);
    }

    .btn {
      font: inherit;
      font-weight: 700;
      color: var(--ink);
      background: var(--sun);
      border: 4px solid var(--ink);
      border-radius: 999px;
      padding: 16px 60px;
      font-size: clamp(1.25rem, 4vw, 1.55rem);
      cursor: pointer;
      box-shadow: 0 6px 0 var(--ink);
      transition: transform 0.12s ease, box-shadow 0.12s ease, background 0.2s ease;
    }
    .btn:hover { transform: translateY(-2px); box-shadow: 0 8px 0 var(--ink); }
    .btn:active { transform: translateY(4px); box-shadow: 0 2px 0 var(--ink); }
    .btn:focus-visible { outline: 4px dashed var(--sky); outline-offset: 6px; }
    .btn--start { margin-top: 34px; }

    /* ---------- Quiz screen ---------- */
    .quiz__top {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 12px;
    }
    .quiz__step {
      background: var(--paper);
      border: 3px solid var(--ink);
      border-radius: 999px;
      padding: 6px 16px;
      font-size: clamp(0.85rem, 2.6vw, 1rem);
      font-weight: 700;
      box-shadow: 0 4px 0 rgba(52, 48, 79, 0.18);
    }
    .dots { display: flex; gap: 8px; }
    .dot {
      width: 15px;
      height: 15px;
      border-radius: 50%;
      background: var(--paper);
      border: 3px solid var(--ink);
    }
    .dot.is-on { background: var(--coral); }

    .card {
      margin: 0;
      width: min(320px, 58vw);
      aspect-ratio: 1 / 1;
      border: 5px solid var(--ink);
      border-radius: 32px;
      overflow: hidden;
      background: var(--paper);
      box-shadow: 0 10px 0 rgba(52, 48, 79, 0.16);
    }
    .card__img { width: 100%; height: 100%; object-fit: cover; display: block; }

    @media (max-height: 720px) {
      .card { width: min(240px, 46vw); }
      .quiz__ask { margin: 10px 0 8px; }
    }

    .quiz__ask {
      font-size: clamp(1.25rem, 4vw, 1.75rem);
      margin: 16px 0 14px;
    }

    .answers {
      width: 100%;
      max-width: 520px;
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
    }
    .answer {
      position: relative;
      font: inherit;
      font-weight: 700;
      font-size: clamp(1.1rem, 3.4vw, 1.45rem);
      color: var(--ink);
      background: var(--paper);
      border: 4px solid var(--ink);
      border-radius: 22px;
      padding: 16px 10px;
      cursor: pointer;
      box-shadow: 0 5px 0 var(--ink);
      transition: transform 0.12s ease, box-shadow 0.12s ease, background 0.2s ease, border-color 0.2s ease;
    }
    .answer:hover:not(:disabled) { transform: translateY(-2px); box-shadow: 0 7px 0 var(--ink); background: #fffdf3; }
    .answer:active:not(:disabled) { transform: translateY(3px); box-shadow: 0 2px 0 var(--ink); }
    .answer:focus-visible { outline: 4px dashed var(--sky); outline-offset: 4px; }
    .answer:disabled { cursor: default; }
    .answer.is-wrong {
      background: #ffe4e4;
      border-color: var(--wrong);
      color: var(--wrong-dark);
      box-shadow: 0 5px 0 var(--wrong-dark);
      animation: shake 0.4s ease;
    }
    .answer.is-correct {
      background: #dcfce7;
      border-color: var(--right);
      color: var(--right-dark);
      box-shadow: 0 5px 0 var(--right-dark);
      animation: bounce 0.55s ease;
    }

    .answer__mark {
      position: absolute;
      top: -15px;
      right: -10px;
      width: 36px;
      height: 36px;
      border-radius: 50%;
      display: none;
      align-items: center;
      justify-content: center;
      font-size: 1.15rem;
      font-weight: 800;
      color: #fff;
      border: 3px solid #fff;
      box-shadow: 0 3px 0 rgba(52, 48, 79, 0.2);
    }
    .answer.is-wrong .answer__mark { display: flex; background: var(--wrong); }
    .answer.is-correct .answer__mark { display: flex; background: var(--right); }

    .feedback {
      min-height: 1.6em;
      margin: 14px 0 0;
      font-size: clamp(1rem, 3vw, 1.18rem);
      font-weight: 700;
      color: var(--soft);
    }
    .feedback.is-wrong { color: var(--wrong-dark); }
    .feedback.is-right { color: var(--right-dark); }

    /* ---------- Victory screen ---------- */
    #winScreen { position: relative; overflow: hidden; padding: 10px 0; }
    .confetti { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
    .confetti span {
      position: absolute;
      top: 0;
      width: 10px;
      height: 16px;
      border-radius: 3px;
      animation: fall 2.8s linear infinite;
    }
    .confetti span:nth-child(1) { left: 6%;  background: #ffd166; animation-delay: 0s; }
    .confetti span:nth-child(2) { left: 18%; background: #66c7ff; animation-delay: 0.5s; }
    .confetti span:nth-child(3) { left: 29%; background: #ff7a59; animation-delay: 1.1s; }
    .confetti span:nth-child(4) { left: 41%; background: #69d6a3; animation-delay: 0.2s; }
    .confetti span:nth-child(5) { left: 52%; background: #c084fc; animation-delay: 1.5s; }
    .confetti span:nth-child(6) { left: 63%; background: #ffd166; animation-delay: 0.8s; }
    .confetti span:nth-child(7) { left: 74%; background: #66c7ff; animation-delay: 1.9s; }
    .confetti span:nth-child(8) { left: 86%; background: #ff7a59; animation-delay: 0.35s; }
    .confetti span:nth-child(9) { left: 94%; background: #69d6a3; animation-delay: 1.25s; }

    .win__emoji { font-size: clamp(3rem, 10vw, 4.6rem); animation: bounce 1.4s ease infinite; }
    .win__title {
      font-size: clamp(1.8rem, 6vw, 2.9rem);
      color: var(--coral);
      text-shadow: 0 3px 0 #fff;
      margin: 4px 0 8px;
    }
    .win__sub { margin: 0; font-size: clamp(1rem, 3vw, 1.25rem); color: var(--soft); }
    .win__words {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 10px;
      margin: 20px 0 26px;
    }
    .win__word {
      background: var(--paper);
      border: 3px solid var(--ink);
      border-radius: 16px;
      padding: 8px 18px;
      font-size: clamp(1rem, 3vw, 1.2rem);
      font-weight: 700;
      box-shadow: 0 4px 0 var(--ink);
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation: none !important; transition: none !important; }
    }
  </style>
</head>
<body>
  <main class="app">
    <!-- Home -->
    <section class="screen is-active" id="homeScreen">
      <div class="home__letters" aria-hidden="true"><span>A</span><span>B</span><span>C</span></div>
      <h1 class="home__title">Let's learning English</h1>
      <p class="home__sub">Look at the picture and pick the right word!</p>
      <button type="button" class="btn btn--start" id="startBtn">Start</button>
    </section>

    <!-- Question -->
    <section class="screen" id="quizScreen" hidden>
      <div class="quiz__top">
        <span class="quiz__step" id="stepLabel">Question 1 of 3</span>
        <div class="dots" id="dots" aria-hidden="true"></div>
      </div>
      <figure class="card">
        <img class="card__img" id="quizImage" src="1.jpg" alt="A picture of an apple" />
      </figure>
      <h2 class="quiz__ask">What is this?</h2>
      <div class="answers" id="answers"></div>
      <p class="feedback" id="feedback" aria-live="polite"></p>
    </section>

    <!-- Victory -->
    <section class="screen" id="winScreen" hidden>
      <div class="confetti" aria-hidden="true">
        <span></span><span></span><span></span><span></span><span></span>
        <span></span><span></span><span></span><span></span>
      </div>
      <div class="win__emoji" aria-hidden="true">🎉</div>
      <h2 class="win__title">Hooray! You did it!</h2>
      <p class="win__sub">You learned three new English words.</p>
      <div class="win__words">
        <span class="win__word">🍎 apple</span>
        <span class="win__word">🐶 dog</span>
        <span class="win__word">👁️ eye</span>
      </div>
      <button type="button" class="btn" id="againBtn">Play again</button>
    </section>
  </main>

  <script>
    (function () {
      'use strict';

      var QUESTIONS = [
        { img: '1.jpg', alt: 'A cute red apple', answer: 'apple', options: ['apple', 'banana', 'pear', 'grape'] },
        { img: '2.jpg', alt: 'A cute brown dog', answer: 'dog', options: ['dog', 'cat', 'mouse', 'bird'] },
        { img: '3.jpg', alt: 'A big blue eye', answer: 'eye', options: ['eye', 'hand', 'foot', 'nose'] }
      ];

      var homeScreen = document.getElementById('homeScreen');
      var quizScreen = document.getElementById('quizScreen');
      var winScreen = document.getElementById('winScreen');
      var startBtn = document.getElementById('startBtn');
      var againBtn = document.getElementById('againBtn');
      var imgEl = document.getElementById('quizImage');
      var answersEl = document.getElementById('answers');
      var stepEl = document.getElementById('stepLabel');
      var dotsEl = document.getElementById('dots');
      var feedbackEl = document.getElementById('feedback');

      var current = 0;
      var locked = false;
      var advanceTimer = null;

      function showScreen(screen) {
        [homeScreen, quizScreen, winScreen].forEach(function (el) {
          el.classList.remove('is-active');
          el.hidden = true;
        });
        screen.hidden = false;
        screen.classList.add('is-active');
      }

      function shuffled(list) {
        var a = list.slice();
        for (var i = a.length - 1; i > 0; i--) {
          var j = Math.floor(Math.random() * (i + 1));
          var t = a[i];
          a[i] = a[j];
          a[j] = t;
        }
        return a;
      }

      function renderDots() {
        dotsEl.innerHTML = '';
        QUESTIONS.forEach(function (_, i) {
          var dot = document.createElement('span');
          dot.className = 'dot' + (i === current ? ' is-on' : '');
          dotsEl.appendChild(dot);
        });
      }

      function renderQuestion() {
        var q = QUESTIONS[current];
        locked = false;
        if (advanceTimer) { clearTimeout(advanceTimer); advanceTimer = null; }

        stepEl.textContent = 'Question ' + (current + 1) + ' of 3';
        renderDots();
        imgEl.src = q.img;
        imgEl.alt = q.alt;
        feedbackEl.textContent = '';
        feedbackEl.className = 'feedback';
        answersEl.innerHTML = '';

        shuffled(q.options).forEach(function (word) {
          var btn = document.createElement('button');
          btn.type = 'button';
          btn.className = 'answer';
          btn.dataset.word = word;
          btn.innerHTML = '<span class="answer__word">' + word + '</span>' +
                          '<span class="answer__mark" aria-hidden="true"></span>';
          btn.addEventListener('click', function () { pick(btn, word); });
          answersEl.appendChild(btn);
        });
      }

      function pick(btn, word) {
        if (locked) return;
        var q = QUESTIONS[current];

        if (word === q.answer) {
          locked = true;
          btn.classList.add('is-correct');
          btn.querySelector('.answer__mark').textContent = '✓';
          Array.prototype.forEach.call(answersEl.querySelectorAll('.answer'), function (b) {
            b.disabled = true;
          });
          feedbackEl.textContent = 'Yes! It is "' + word + '". ✓';
          feedbackEl.className = 'feedback is-right';
          advanceTimer = setTimeout(next, 1150);
        } else {
          btn.classList.add('is-wrong');
          btn.disabled = true;
          btn.querySelector('.answer__mark').textContent = '✗';
          feedbackEl.textContent = 'Oops! Try again. ✗';
          feedbackEl.className = 'feedback is-wrong';
        }
      }

      function next() {
        current++;
        if (current < QUESTIONS.length) {
          renderQuestion();
        } else {
          showScreen(winScreen);
        }
      }

      startBtn.addEventListener('click', function () {
        current = 0;
        showScreen(quizScreen);
        renderQuestion();
      });

      againBtn.addEventListener('click', function () {
        current = 0;
        showScreen(homeScreen);
      });

      showScreen(homeScreen);
    })();
  </script>
</body>
</html>
